# Single entry point for the dev stack (mounted at /etc/nginx/conf.d/default.conf).
#
#   /api/*, /mcp, /mcp/*, /up                -> Laravel (php-fpm in the `app` service)
#   /oauth/*, /.well-known/oauth-*           -> Laravel too (OAuth for MCP clients)
#   /app/*                                   -> Reverb (the `reverb` service), live board updates
#   everything else                          -> Next.js dev server (the `web` service)
#
# Serving both on one origin means the browser never makes a cross-origin call.

# Pass the WebSocket upgrade through for Next.js hot reloading; plain requests
# get a normal keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # The Laravel repo is mounted read-only here so try_files can look at public/.
    root /var/www/html/public;
    index index.php;

    # --- Laravel --------------------------------------------------------------
    location ^~ /api/ {
        try_files $uri /index.php?$query_string;
    }

    # MCP: the web transport lives at /mcp itself, so match it exactly as well.
    location ^~ /mcp/ {
        try_files $uri /index.php?$query_string;
    }

    location = /mcp {
        try_files $uri /index.php?$query_string;
    }

    # OAuth for MCP clients: authorize, token, client registration, and the
    # discovery documents. (The web app's consent page is /authorize.)
    location ^~ /oauth/ {
        try_files $uri /index.php?$query_string;
    }

    location ^~ /.well-known/oauth- {
        try_files $uri /index.php?$query_string;
    }

    # Laravel health check.
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    # --- Reverb ---------------------------------------------------------------
    # Browsers' WebSocket connections (/app/<key>). Its HTTP API (/apps/...),
    # which the app sends events to, stays inside the compose network.
    location ^~ /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 120s;
    }

    # Reached via the internal redirects above; every PHP request is handled
    # by Laravel's front controller.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_hide_header X-Powered-By;
    }

    # --- Next.js --------------------------------------------------------------
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;

        # HMR websocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep the original host (with port) so Next sees the same origin the
        # browser uses.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
