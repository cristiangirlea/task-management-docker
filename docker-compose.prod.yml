# Production stack: one server, everything in containers.
#
#   internet ──> caddy :80/:443 (automatic HTTPS for ${SITE_DOMAIN})
#                  ├── /api/*, /mcp, /up ──> app (Laravel php-fpm :9000) ──> postgres, redis
#                  └── everything else  ──> web (Next.js standalone :3000)
#   backup: nightly pg_dump to a volume, copied off-site with rclone
#
# The app images are built and published by the app repos' release workflows
# (ghcr.io/<owner>/task-management-api and -web); nothing is built here except
# the small backup image. Run it through bin/prod, which passes .env.prod:
#
#   cp .env.prod.example .env.prod   # then fill it in
#   bin/prod up -d
#
# docs/production.md is the full runbook.

name: ${PROJECT_NAME:-task_management}

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: *defaults
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is not set (see .env.prod.example)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys. Losing this volume means re-issuing them.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy

  # Runs migrations on start, then php-fpm (healthy once php-fpm answers).
  app:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:-cristiangirlea}/task-management-api:${API_TAG:-latest}
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *defaults
    image: ghcr.io/${GHCR_OWNER:-cristiangirlea}/task-management-web:${WEB_TAG:-latest}

  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is not set (see .env.prod.example)}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is not set (see .env.prod.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set (see .env.prod.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set (see .env.prod.example)}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Deliberately not given .env.prod: it needs the database login and its own
  # storage credentials (backup.env), not the app's Stripe or mail secrets.
  backup:
    <<: *defaults
    build: ./.docker/backup
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_DATABASE}
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
    env_file:
      - path: backup.env
        required: false
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backups:
