# Development stack for the task management app.
#
#   browser ──> nginx :${NGINX_PORT}
#                 ├── /api/*, /mcp, /up ──> app (Laravel, php-fpm :9000) ──> postgres, redis
#                 └── everything else  ──> web (Next.js dev server :3000)
#
# The Laravel and Next.js repos are expected next to this one (see .env.example:
# LARAVEL_CONTEXT / NEXT_CONTEXT). Both are bind-mounted for live editing.
#
# Compose resolves `dockerfile:` relative to the build context, i.e. relative
# to the app repo, so the Dockerfiles kept in this repo are reached through
# ${STACK_DIR} (the path of this directory as seen from the app repos).

name: ${PROJECT_NAME:-task_management}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is not set (copy .env.example to .env)}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is not set (copy .env.example to .env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is not set (copy .env.example to .env)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is not set (copy .env.example to .env)}"]
    environment:
      # Lets the healthcheck's redis-cli authenticate without putting the
      # password on the command line.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Laravel API, served by php-fpm. Reachable only from nginx (port 9000 is not
  # published on the host).
  app:
    build:
      context: ${LARAVEL_CONTEXT:-../task-management-app}
      dockerfile: ${STACK_DIR:-../task-management-docker}/.docker/laravel/Dockerfile
    env_file: .env
    volumes:
      # Live code. This hides the vendor/ directory baked into the image, so
      # docker-entrypoint.sh (below) runs `composer install` when it is missing
      # and then hands over to the repo's own entrypoint.sh.
      - ${LARAVEL_CONTEXT:-../task-management-app}:/var/www/html
      - ./.docker/laravel/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    entrypoint: ["docker-entrypoint.sh"]
    expose:
      - "9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Next.js dev server. Reachable only through nginx, so the browser talks to
  # the API on the same origin and CORS never gets in the way.
  web:
    build:
      context: ${NEXT_CONTEXT:-../task-management-next-react}
      dockerfile: ${STACK_DIR:-../task-management-docker}/.docker/next/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${NGINX_PORT:-8080}/api
      # File watching over bind mounts needs polling.
      WATCHPACK_POLLING: "true"
    volumes:
      - ${NEXT_CONTEXT:-../task-management-next-react}:/usr/src/app
      # Keep the image's Linux node_modules instead of whatever the host has.
      - /usr/src/app/node_modules
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only copy of the Laravel repo so try_files can see public/.
      - ${LARAVEL_CONTEXT:-../task-management-app}:/var/www/html:ro
    depends_on:
      app:
        condition: service_started
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
