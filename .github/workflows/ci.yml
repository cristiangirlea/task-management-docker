name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate the stacks and drill the backups
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compose files render
        run: |
          cp .env.example .env
          docker compose config --quiet
          cp .env.prod.example .env.prod
          docker compose -f docker-compose.prod.yml --env-file .env.prod config --quiet

      - name: Caddyfile is valid
        run: |
          docker run --rm -e SITE_DOMAIN=example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build the backup image
        run: docker build -t tm-backup .docker/backup

      # A dump goes off-site (a local rclone remote here) and restores into a
      # fresh database with its data intact.
      - name: Backup and restore drill
        run: |
          docker network create ci
          docker run -d --name db --network ci -e POSTGRES_USER=app -e POSTGRES_PASSWORD=secret -e POSTGRES_DB=app postgres:16-alpine
          # Over TCP: during first-start initialisation the image runs a
          # temporary server on the socket only, then restarts.
          for i in $(seq 1 30); do docker exec db pg_isready -h 127.0.0.1 -U app -d app && break; sleep 1; done
          docker exec db psql -U app -d app -c "create table notes (id serial primary key, body text); insert into notes (body) values ('kept')"

          run() {
            docker run --rm --network ci \
              -e PGHOST=db -e PGUSER=app -e PGPASSWORD=secret -e PGDATABASE=app \
              -e RCLONE_CONFIG_OFFSITE_TYPE=local -e BACKUP_REMOTE=offsite:/offsite \
              -v "$PWD/ci-backups:/backups" -v "$PWD/ci-offsite:/offsite" \
              --entrypoint sh tm-backup -c "$1"
          }
          run backup.sh
          ls ci-offsite | grep -q '\.dump$'
          run 'rm /backups/*.dump && createdb drill && RESTORE_DATABASE=drill restore.sh "$(rclone -q lsf offsite:/offsite | head -1)"'
          test "$(docker exec db psql -U app -d drill -tAc 'select body from notes')" = kept

      - name: The backup service schedules itself
        run: |
          docker run -d --name cron -e BACKUP_SCHEDULE='0 4 * * *' -e PGDATABASE=app tm-backup
          sleep 2
          docker logs cron
          test "$(docker inspect -f '{{.State.Running}}' cron)" = true
          docker exec cron cat /etc/crontabs/root | grep -q '^0 4 \* \* \* \. /etc/backup.env && '

      # The published API image run the way docker-compose.prod.yml runs the
      # scheduler: it must not migrate, the reconcile's output must reach the
      # container log, and the heartbeat behind the health check must appear.
      - name: The scheduler runs from the published API image
        run: |
          docker run -d --name scheduler \
            -e APP_ENV=production -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/scheduler.sqlite \
            -e CACHE_STORE=array -e LOG_CHANNEL=stderr -e SCHEDULE_OUTPUT=/proc/1/fd/1 \
            ghcr.io/cristiangirlea/task-management-api:latest php artisan schedule:work

          for i in $(seq 1 30); do
            docker logs scheduler 2>&1 | grep -q 'Running scheduled tasks' && break
            [ "$(docker inspect -f '{{.State.Running}}' scheduler)" = true ] || break
            sleep 2
          done
          docker logs scheduler 2>&1 | grep -q 'Running scheduled tasks' || { docker logs scheduler; exit 1; }
          if docker logs scheduler 2>&1 | grep -qi 'migrat'; then echo "the scheduler must not migrate"; exit 1; fi
          docker exec scheduler php artisan schedule:list | grep -q billing:reconcile-seats

          docker exec scheduler touch /tmp/scheduler.sqlite
          docker exec scheduler php artisan migrate --force
          docker exec scheduler php artisan schedule:test --name=billing:reconcile-seats
          for i in $(seq 1 10); do docker logs scheduler 2>&1 | grep -q 'Checked 0 paying workspaces' && break; sleep 1; done
          docker logs scheduler 2>&1 | grep -q 'Checked 0 paying workspaces' || { docker logs scheduler; echo "reconcile output did not reach the log"; exit 1; }

          healthy='find /var/www/html/storage/framework/schedule-heartbeat -mmin -3 2>/dev/null | grep -q .'
          docker exec scheduler rm -f /var/www/html/storage/framework/schedule-heartbeat
          for i in $(seq 1 45); do docker exec scheduler sh -c "$healthy" && break; sleep 2; done
          docker exec scheduler sh -c "$healthy" || { docker logs scheduler; echo "no heartbeat after 90s"; exit 1; }
